<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itzfizz - Premium Pinned Scroll Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-viewport">
        
        
        <div class="graphic-layer">
            <div id="scrolling-object">
                <div class="car-body">
                    <div class="car-cockpit"></div>
                    <div class="car-wheel wheel-front"></div>
                    <div class="car-wheel wheel-back"></div>
                    <span class="element-text">CAR</span>
                </div>
            </div>
        </div>

        
        <section class="trigger-zone frame-1">
            <div class="content-box" id="content1">
                <h1 class="main-title">W E L C O M E &nbsp; I T &nbsp; Z &nbsp; F &nbsp; I &nbsp; Z &nbsp; Z</h1>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <span class="stat-number text-blue">58%</span>
                        <span class="stat-label">Increase in pick up point use</span>
                    </div>
                </div>
            </div>
        </section>

        
        <section class="trigger-zone frame-2">
            <div class="content-box" id="content2" style="opacity: 0;">
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <span class="stat-number text-red">23%</span>
                        <span class="stat-label">Decreased in customer phone calls</span>
                    </div>
                </div>
            </div>
        </section>

        
        <section class="trigger-zone frame-3">
            <div class="content-box" id="content3" style="opacity: 0;">
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <span class="stat-number text-green">27%</span>
                        <span class="stat-label">Increase in pick up point use</span>
                    </div>
                </div>
            </div>
        </section>

        
        <section class="trigger-zone frame-4">
            <div class="content-box" id="content4" style="opacity: 0;">
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <span class="stat-number text-purple">40%</span>
                        <span class="stat-label">Decreased in customer phone calls</span>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
